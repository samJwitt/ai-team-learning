name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build HomelabInventory.slnx --configuration Release

      - name: Test
        run: dotnet test HomelabInventory.slnx --configuration Release --no-build
